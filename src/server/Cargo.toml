[package]
name = "kokoro-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "OpenAI-compatible text-to-speech HTTP server on top of libkokoro (public C API only)"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "kokoro_server"
path = "lib.rs"

[[bin]]
name = "kokoro-server"
path = "main.rs"

[[test]]
name = "server_synthesis"
path = "tests/server_synthesis.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
ureq = { version = "3", default-features = false }

[profile.release]
lto = "thin"
