name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            arch: x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
          - name: macos-arm64
            os: macos-15
            arch: arm64
          - name: windows-x64
            os: windows-2025
            arch: x64
          - name: windows-arm64
            os: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/server -> ../../build/cargo

      - name: Cache model and voices
        uses: actions/cache@v6
        with:
          path: models
          key: kokoro-models-${{ hashFiles('bootstrap.py') }}
          restore-keys: kokoro-models-
          enableCrossOsArchive: true

      - name: Download ONNX Runtime, model and voices
        run: uv run bootstrap.py configure

      - name: Locate MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcvars = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -find 'VC\Auxiliary\Build\vcvarsall.bat' | Select-Object -First 1
          if (-not $vcvars) { throw 'vcvarsall.bat not found' }
          "VCVARSALL=$vcvars" >> $env:GITHUB_ENV

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VCVARSALL%" ${{ matrix.arch }} || exit /b 1
          uv run bootstrap.py build

      - name: Build
        if: runner.os != 'Windows'
        run: uv run bootstrap.py build

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Lint kokoro-server
        if: matrix.name == 'linux-x64'
        working-directory: src/server
        env:
          KOKORO_LIB_DIR: ${{ github.workspace }}/build
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/cargo
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
